# Hermes Avatar Configuration
# 
# This is the MAIN config template. DO NOT commit sensitive data here.
# Use config.local.yaml for local overrides and .env for secrets.
#
# Run `python setup.py` to configure interactively.

# Screen capture settings
screen_capture:
  interval_seconds: 30  # 5-60 seconds (configurable)
  enabled: true

# Hermes Agent API (platform nativo "api_server", OpenAI-compatible)
# Richiede in ~/.hermes/config.yaml: platforms.api_server.enabled: true + key
# La chiave API sta in .env come HERMES_API_KEY (mai in questo file, è in git)
api:
  endpoint: "http://localhost:8642/v1/chat/completions"  # Hermes gateway api_server
  model: "hermes-agent"   # il gateway risolve il suo modello di default
  timeout: 150            # le turni agent con tool possono superare i 60s
  session_id: "rail-chat"      # contesto conversazione chat
  capture_session_id: "rail-screen"  # contesto separato per screen capture
  api_key_env: "HERMES_API_KEY"

# Avatar settings
avatar:
  width: 200
  height: 200
  position: "top-right"  # top-left, top-right, bottom-left, bottom-right
  always_on_top: true
  transparent_background: false

# Animation settings
animation:
  fps: 12
  idle_frames: 4
  speak_frames: 6
  think_frames: 3
  alert_frames: 4

# Chat window settings
chat_window:
  width: 400
  height: 300
  position: "below_avatar"  # below, right, left
  auto_open_on_message: true

# Discord integration (configured via setup.py)
# Channel ID and Hermes user ID are loaded from:
#   1. Environment variables (DISCORD_CHANNEL_ID, HERMES_USER_ID)
#   2. config.local.yaml
#   3. Defaults (1552636595532865587, 371369636924751873)
discord:
  # These are just defaults - override in config.local.yaml or env vars
  channel_id: "1552636595532865587"
  hermes_user_id: "371369636924751873"

# Hermes integration (TODO: Configure when proxy is set up)
hermes:
  profile: "default"
  send_screenshots: true
  receive_suggestions: true
  # api_key_env: "HERMES_API_KEY"  # For future use
